name: CI

on:
  push:
  pull_request:

jobs:
  install-and-build:
    name: Install, lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: yarn test:e2e
        env:
          CI: true
          NEXTAUTH_URL: http://127.0.0.1:3000
          NEXTAUTH_SECRET: ci-test-secret
          GOOGLE_ID: dummy-google-id
          GOOGLE_CLIENT_SECRET: dummy-google-secret
          MONGODB_URI: mongodb://127.0.0.1:27017/promptopia-test
